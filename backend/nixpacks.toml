[phases.setup]
nixPkgs = ["php82", "php82Packages.composer", "php82Extensions.pdo_mysql", "php82Extensions.mbstring", "php82Extensions.xml"]

[phases.install]
cmds = ["composer install --no-dev --optimize-autoloader"]

[phases.build]
cmds = [
  "cp .env.example .env",
  "php artisan key:generate",
  "php artisan migrate --force",
  "php artisan db:seed --force",
]

[start]
cmd = "php artisan reverb:start --port=8080 & php artisan serve --host=0.0.0.0 --port=$PORT"
